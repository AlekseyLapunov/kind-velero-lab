apiVersion: v1
kind: Namespace
metadata:
  name: app
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: demoapp-pvc
  namespace: app
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-storage
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demoapp
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demoapp
  template:
    metadata:
      labels:
        app: demoapp
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_DB
          value: "demodb"
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: demoapp-db-secrets
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: demoapp-db-secrets
              key: password
        ports:
        - containerPort: 5432
          name: postgres
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        - name: init-script
          mountPath: /docker-entrypoint-initdb.d
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: demoapp-pvc
      - name: init-script
        configMap:
          name: pg-init-script
---
apiVersion: v1
kind: Service
metadata:
  name: demoapp-service
  namespace: app
spec:
  type: NodePort
  selector:
    app: demoapp 
  ports:
  - port: 5432
    targetPort: 5432
    nodePort: 31532 

